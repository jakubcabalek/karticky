name: Web checks and deployment

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: karticky-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_APP_CHANNEL: ${{ github.ref == 'refs/heads/dev' && 'development' || 'production' }}
      EXPO_PUBLIC_APP_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Until the first `npx expo install` on the Mac commits package-lock.json, install without it.
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      # The artwork index for scanning comes from the "Scan index" workflow.
      - run: gh release download scan-index -p scan-index-v1.bin -D public || echo "Index karet zatím není, skenování podle obrázku nepůjde."
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run web:build
      - name: Check Cloudflare settings (length and shape only, never the value)
        if: github.ref == 'refs/heads/claude/diagnose-token'
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          check() {
            local name="$1" value="$2"
            echo "$name: length ${#value}"
            [[ "$value" =~ [[:space:]] ]] && echo "$name: contains spaces or line breaks"
            [[ "$value" == Bearer* ]] && echo "$name: starts with the word Bearer"
            [[ "$value" == *curl* ]] && echo "$name: contains a curl command"
            [[ "$value" =~ [^A-Za-z0-9_-] ]] && echo "$name: contains characters other than letters, digits, - and _"
            true
          }
          check token "$TOKEN"
          check account "$ACCOUNT"
          [[ "$ACCOUNT" =~ ^[0-9a-f]{32}$ ]] && echo "account: looks like an account ID" || echo "account: does NOT look like a 32-character account ID"
      - name: Deploy to Cloudflare Pages
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name != 'pull_request' && vars.CLOUD_DEPLOY_READY == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web-build --project-name=karticky --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
